stages:
  detect:
    cmd: python3 scripts/run_detect.py --max-hands ${detect.max_hands} --class-name ${detect.target_class}
    deps:
      - scripts/detect_hands.py
      - scripts/run_detect.py
      - data/raw
    params:
      - detect.max_hands
      - detect.target_class
    outs:
      - data/labeled:
          persist: true

  crop:
    cmd: python3 scripts/process_annotations.py --crop-only --padding ${crop.padding}
    deps:
      - scripts/process_annotations.py
      - data/annotations/dataset.json
      - data/labeled
    params:
      - crop.padding
    outs:
      - data/processed:
          persist: true
